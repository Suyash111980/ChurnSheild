services:
  - type: web
    name: churnshield-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_ALGORITHM
        sync: false
      - key: MASTER_ADMIN_USER_ID
        sync: false
      - key: MODEL_PATH
        value: ../ml/artifacts/churn_model.joblib
      - key: MODEL_APPROVED_VERSION
        sync: false
